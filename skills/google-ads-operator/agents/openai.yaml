interface:
  display_name: "Google Ads Operator"
  short_description: "Safe Google Ads analysis and typed operations"
  default_prompt: "Use $google-ads-operator to audit Google Ads evidence and, only when explicitly authorized, preview and verify a policy-gated typed operation."

dependencies:
  tools:
    - type: "mcp"
      value: "google-ads"
      description: "Google Ads analysis and policy-gated Safe Operator MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
