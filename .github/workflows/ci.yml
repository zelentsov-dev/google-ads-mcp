name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.13"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run --frozen python scripts/verify_critical_coverage.py
      - run: uv run --frozen python scripts/validate_read_only.py
      - run: uv run --frozen python scripts/validate_gaql_templates.py
      - run: uv run --frozen python scripts/validate_manifests.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.13"
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen python -m build
      - run: uv run --frozen python scripts/package_plugin.py dist/google-ads-mcp-plugin-0.2.0.zip
      - run: uv run --frozen python scripts/scan_artifacts.py dist/*
      - run: uv run --frozen python scripts/generate_checksums.py dist
      - run: python -m venv /tmp/google-ads-mcp-smoke
      - run: /tmp/google-ads-mcp-smoke/bin/pip install dist/*.whl
      - run: /tmp/google-ads-mcp-smoke/bin/google-ads-mcp version
      - run: python -m venv /tmp/google-ads-mcp-sdist-smoke
      - run: /tmp/google-ads-mcp-sdist-smoke/bin/pip install dist/*.tar.gz
      - run: /tmp/google-ads-mcp-sdist-smoke/bin/google-ads-mcp version
      - run: uv run --frozen python scripts/smoke_plugin_archive.py dist/google-ads-mcp-plugin-0.2.0.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
