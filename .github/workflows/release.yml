name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    if: github.repository == 'zelentsov-dev/google-ads-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.13"
          enable-cache: false
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen python scripts/verify_release_version.py
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/verify_critical_coverage.py
      - run: uv run --frozen python scripts/validate_read_only.py
      - run: uv run --frozen python scripts/validate_gaql_templates.py
      - run: uv run --frozen python scripts/validate_manifests.py
      - run: uv run --frozen python -m build
      - run: uv run --frozen python scripts/package_plugin.py dist/google-ads-mcp-plugin-${GITHUB_REF_NAME#v}.zip
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dist/google-ads-mcp.spdx.json
      - run: uv run --frozen python scripts/scan_artifacts.py dist/*
      - run: uv run --frozen python scripts/generate_checksums.py dist
      - run: python -m venv /tmp/google-ads-mcp-wheel-smoke
      - run: /tmp/google-ads-mcp-wheel-smoke/bin/pip install dist/google_ads_operator_mcp-0.1.0-py3-none-any.whl
      - run: /tmp/google-ads-mcp-wheel-smoke/bin/google-ads-mcp version
      - run: python -m venv /tmp/google-ads-mcp-sdist-smoke
      - run: /tmp/google-ads-mcp-sdist-smoke/bin/pip install dist/google_ads_operator_mcp-0.1.0.tar.gz
      - run: /tmp/google-ads-mcp-sdist-smoke/bin/google-ads-mcp version
      - run: uv run --frozen python scripts/smoke_plugin_archive.py dist/google-ads-mcp-plugin-0.1.0.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: dist/*

  github-release:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/release-notes-v0.1.0.md
        env:
          GH_TOKEN: ${{ github.token }}

  pypi-publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-dist
          path: dist
      - run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: pypi-dist
